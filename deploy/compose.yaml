services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      Storage__Provider: Postgres
      Storage__ApplyMigrations: "true"
      ConnectionStrings__Scada: Host=postgres;Port=5432;Database=scada;Username=scada;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Security__ViewerApiKey: ${SCADA_VIEWER_KEY:?Set SCADA_VIEWER_KEY}
      Security__OperatorApiKey: ${SCADA_OPERATOR_KEY:?Set SCADA_OPERATOR_KEY}
      Security__AdminApiKey: ${SCADA_ADMIN_KEY:?Set SCADA_ADMIN_KEY}
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: scada
      POSTGRES_USER: scada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - scada_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scada -d scada"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scada_pgdata:
