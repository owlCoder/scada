services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scada
      POSTGRES_USER: scada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Постави POSTGRES_PASSWORD у окружењу}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scada_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scada -d scada"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scada_pgdata:
