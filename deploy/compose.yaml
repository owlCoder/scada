services:
  api:
    image: ${SCADA_IMAGE:-scada-api:local}
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      Protocols__OpcUa__Enabled: ${SCADA_OPCUA_ENABLED:-false}
      Protocols__OpcUa__BindAddress: 0.0.0.0
      Protocols__Modbus__Enabled: ${SCADA_MODBUS_ENABLED:-false}
      Protocols__Modbus__BindAddress: 0.0.0.0
      Storage__Provider: Postgres
      Storage__ApplyMigrations: "true"
      ConnectionStrings__Scada: Host=postgres;Port=5432;Database=scada;Username=scada;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Security__ViewerApiKey: ${SCADA_VIEWER_KEY:?Set SCADA_VIEWER_KEY}
      Security__OperatorApiKey: ${SCADA_OPERATOR_KEY:?Set SCADA_OPERATOR_KEY}
      Security__AdminApiKey: ${SCADA_ADMIN_KEY:?Set SCADA_ADMIN_KEY}
      Observability__JsonLogs: "true"
      Observability__OtlpEndpoint: ${SCADA_OTLP_ENDPOINT:-}
      Authentication__Oidc__Enabled: ${SCADA_OIDC_ENABLED:-false}
      Authentication__Oidc__Authority: http://127.0.0.1:8081/realms/scada
      Authentication__Oidc__MetadataAddress: http://keycloak:8080/realms/scada/.well-known/openid-configuration
      Authentication__Oidc__RequireHttpsMetadata: "false"
      Authentication__Oidc__ClientId: scada-api
      Authentication__Oidc__ClientSecret: ${SCADA_OIDC_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${SCADA_HTTP_PORT:-5080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - scada_api_data:/var/lib/scada
    healthcheck:
      test: ["CMD", "dotnet", "Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: scada
      POSTGRES_USER: scada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,mode=1777
    security_opt: [no-new-privileges:true]
    user: postgres
    cap_drop: [ALL]
    volumes:
      - scada_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scada -d scada"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional traces and metrics: docker compose --profile observability up -d with SCADA_OTLP_ENDPOINT=http://aspire-dashboard:18889.
  # The dashboard prints its login token in its log (docker compose logs aspire-dashboard).
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:18888:18888"

volumes:
  scada_api_data:
  scada_pgdata:
