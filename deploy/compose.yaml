services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      Storage__Provider: Postgres
      ConnectionStrings__Scada: Host=postgres;Port=5432;Database=scada;Username=scada;Password=${POSTGRES_PASSWORD:?Постави POSTGRES_PASSWORD}
      Security__ViewerApiKey: ${SCADA_VIEWER_KEY:?Постави SCADA_VIEWER_KEY}
      Security__OperatorApiKey: ${SCADA_OPERATOR_KEY:?Постави SCADA_OPERATOR_KEY}
      Security__AdminApiKey: ${SCADA_ADMIN_KEY:?Постави SCADA_ADMIN_KEY}
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scada
      POSTGRES_USER: scada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Постави POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scada_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scada -d scada"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scada_pgdata:
