# Optional single sign-on with Keycloak. Kept in its own file so the default stack needs no Keycloak secrets:
#   docker compose -f deploy/compose.yaml -f deploy/compose.keycloak.yaml up -d
#   scripts/keycloak-bootstrap.sh
# with SCADA_OIDC_ENABLED=true, KEYCLOAK_ADMIN_PASSWORD and SCADA_OIDC_CLIENT_SECRET set.
# The realm (deploy/keycloak/scada-realm.json) contains no users.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://127.0.0.1:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      SCADA_OIDC_CLIENT_SECRET: ${SCADA_OIDC_CLIENT_SECRET:?Set SCADA_OIDC_CLIENT_SECRET}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./keycloak/scada-realm.json:/opt/keycloak/data/import/scada-realm.json:ro
